<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Love Letter</title>
<style>
  body {
    background: #f0e6dc;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    font-family: 'Georgia', serif;
  }
  .envelope {
    width: 350px;
    background: #fff;
    border: 2px solid #c9a27c;
    border-radius: 8px;
    box-shadow: 0 6px 12px rgba(0,0,0,0.2);
    position: relative;
    padding: 20px;
  }
  .envelope::before {
    content: "";
    position: absolute;
    top: -60px;
    left: 0;
    width: 0;
    height: 0;
    border-left: 175px solid transparent;
    border-right: 175px solid transparent;
    border-bottom: 60px solid #c9a27c;
  }
  .letter {
    text-align: left;
    color: #333;
    line-height: 1.6;
  }
  .letter h2 {
    color: #d46a6a;
    text-align: center;
    margin-bottom: 15px;
  }
</style>
</head>
<body>
  <div class="envelope">
    <div class="letter">
      <h2>💌 A Letter for You</h2>
      <p>Dear Celeystina Uyang,</p>
      <p>Do you want to be my girlfriend?</p>
      <p>If yes, please tell me honestly or reply "yes" on WhatsApp.</p>
      <p>Yours truly,<br> Edwyn</p>
    </div>
  </div>
</body>
</html>
